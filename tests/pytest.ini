[pytest]
# ═══════════════════════════════════════════════════════════════════════════════
# CCDT Test Suite — pytest configuration
# ═══════════════════════════════════════════════════════════════════════════════

# Test discovery
testpaths     = tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode  = auto

# Output verbosity
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:cacheprovider

# Custom markers
markers =
    unit:        Fast, isolated unit tests — no external services (< 50ms each)
    integration: Tests requiring mocked services or test containers
    e2e:         Full-stack end-to-end tests requiring all services running
    chaos:       Resilience tests injecting failures into the system
    layer1:      Tests for the eBPF Nervous System (Layer-1)
    layer2:      Tests for the Causal GNN Cognitive Core (Layer-2)
    layer3:      Tests for the Guardian RL + OPA system (Layer-3)
    layer4:      Tests for the Co-Pilot LLM interface (Layer-4)
    gateway:     Tests for the API Gateway
    slow:        Tests that take > 5 seconds
    kafka:       Tests requiring a Kafka broker
    k8s:         Tests requiring a Kubernetes cluster

# Logging during tests
log_cli             = true
log_cli_level       = WARNING
log_cli_format      = %(asctime)s %(name)-32s %(levelname)-8s %(message)s
log_cli_date_format = %H:%M:%S

# Timeouts (requires pytest-timeout)
# timeout = 30
