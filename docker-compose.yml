# ══════════════════════════════════════════════════════════════════════════════
# CCDT — Local Development Stack (docker-compose.yml)
# ══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   make dev                    → start full stack (background)
#   make dev-logs               → tail all logs
#   make dev-down               → stop and remove containers
#   docker compose up layer2-gnn layer3-guardian   → start specific services
#
# Prerequisites:
#   • Docker Desktop >= 4.25 (or Docker Engine >= 24 + Compose V2)
#   • .env file with ANTHROPIC_API_KEY (copy .env.example → .env)
#   • 8 GB RAM minimum; 16 GB recommended for all layers
#
# Port map:
#   3000  → Dashboard (React)
#   8000  → API Gateway
#   8001  → Layer-2 GNN inference server
#   8002  → Layer-3 Guardian executor
#   8003  → Layer-4 Co-Pilot
#   8181  → OPA policy server
#   9092  → Kafka broker (PLAINTEXT)
#   9093  → Kafka KRaft controller (internal)
#   9100  → Layer-1 metrics / event query endpoint
#   9090  → Prometheus
#   3001  → Grafana
#   6379  → Redis
#
# Service dependency graph:
#   kafka-init ──┐
#   kafka        ├── layer2-gnn ──┬── layer3-guardian ──┬── layer4-copilot ──┬── api-gateway ── dashboard
#   opa          │                └──────────────────────┘                    │
#   redis        └─────────────────────────────────────────────────────────────┘
#
# ══════════════════════════════════════════════════════════════════════════════

version: "3.9"

# Load .env automatically (docker compose reads .env by default)
# Copy .env.example → .env and set ANTHROPIC_API_KEY before running

networks:
  ccdt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  kafka-data:
    driver: local
  kafka-secrets:
    driver: local
  redis-data:
    driver: local
  model-checkpoints:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/checkpoints/gnn
  rl-checkpoints:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/checkpoints/rl
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  demo-postgres-data:
    driver: local
  ollama-data:
  # SQLite database file (incidents, policies, chaos runs)
  ccdt-data:
    driver: local
    driver_opts:
      type:   none
      o:      bind
      device: ${PWD}/data

# ── Shared environment anchors ──────────────────────────────────────────────
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_EBPF:        ccdt.ebpf.events
  KAFKA_TOPIC_INFER:       ccdt.gnn.inference
  KAFKA_TOPIC_ACTIONS:     ccdt.guardian.actions
  KAFKA_TOPIC_INCIDENTS:   ccdt.incidents

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &restart-policy
  restart: unless-stopped

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout:  5s
  retries:  5
  start_period: 20s

services:

  # ────────────────────────────────────────────────────────────────────────────
  # Infrastructure: Kafka (KRaft mode — no ZooKeeper)
  # ────────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    <<: *restart-policy
    hostname: kafka
    networks: [ccdt-net]
    ports:
      - "9092:9092"    # external PLAINTEXT listener
      - "9093:9093"    # KRaft controller listener (internal only)
    environment:
      # KRaft mode (no ZooKeeper)
      KAFKA_PROCESS_ROLES:                  "broker,controller"
      KAFKA_NODE_ID:                        "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS:       "1@kafka:9093"
      KAFKA_LISTENERS:                      "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS:           "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES:      "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME:     "PLAINTEXT"
      KAFKA_LOG_DIRS:                       "/var/lib/kafka/data"
      CLUSTER_ID:                            ccdt-dev-cluster-0001
      KAFKA_CLUSTER_ID:                     "ccdt-dev-cluster-0001"
      # Topic defaults (dev-friendly)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:      "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR:     "1"
      KAFKA_MIN_INSYNC_REPLICAS:            "1"
      KAFKA_NUM_PARTITIONS:                 "4"
      KAFKA_LOG_RETENTION_HOURS:            "24"
      KAFKA_LOG_SEGMENT_BYTES:              "104857600"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # JVM heap (dev sized)
      KAFKA_HEAP_OPTS:                      "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *hc-defaults
      test:
        - CMD-SHELL
        - "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
    logging: *default-logging

  # Kafka topic provisioner (runs once, exits)
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      kafka:
        condition: service_started
    networks: [ccdt-net]
    restart: "no"
    command:
      - bash
      - -c
      - |
        echo 'Creating CCDT Kafka topics ...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ccdt.topology.updates --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ccdt.ebpf.events --partitions 4 --replication-factor 1 --config retention.ms=86400000 --config compression.type=lz4 --config max.message.bytes=65536
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ccdt.gnn.inference --partitions 2 --replication-factor 1 --config retention.ms=604800000 --config compression.type=gzip
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ccdt.guardian.actions --partitions 2 --replication-factor 1 --config retention.ms=2592000000 --config compression.type=gzip
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ccdt.incidents --partitions 2 --replication-factor 1 --config cleanup.policy=compact,delete --config retention.ms=7776000000
        echo 'All topics created:'
        kafka-topics --bootstrap-server kafka:9092 --list
    logging: *default-logging

  # ── Kafka UI (dev convenience) ─────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    <<: *restart-policy
    networks: [ccdt-net]
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:          ccdt-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE:                      disabled
      MANAGEMENT_HEALTH_LDAP_ENABLED: "false"
    profiles: [tools]   # only starts with: docker compose --profile tools up
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Infrastructure: Redis (session store + rate limiter)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    <<: *restart-policy
    hostname: redis
    networks: [ccdt-net]
    ports:
      - "6379:6379"
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 60 100
        --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Infrastructure: OPA (Open Policy Agent — Guardian sidecar)
  # ────────────────────────────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.63.0
    <<: *restart-policy
    hostname: opa
    networks: [ccdt-net]
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - --log-format=json
      - /policies
    volumes:
      - ./services/layer3-guardian/opa/policies:/policies:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "opa", "version"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Layer-2: Causal GNN Inference Server
  # ────────────────────────────────────────────────────────────────────────────
  layer2-gnn:
    build:
      context: services/layer2-cognitive
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "dev"
        GIT_SHA:    "dev"
    image: ccdt/layer2-cognitive:dev
    <<: *restart-policy
    hostname: layer2-cognitive
    networks: [ccdt-net]
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      LOG_LEVEL:            INFO
      INFER_INTERVAL_S:     "5"
      INFERENCE_CACHE_TTL_S: "2"
      OMP_NUM_THREADS:      "2"
      K8S_NAMESPACE:        ${K8S_DEMO_NAMESPACE:-demo-app}
      K8S_DEMO_NAMESPACE:   ${K8S_DEMO_NAMESPACE:-demo-app}
      KUBECONFIG_PATH:      ${KUBECONFIG_PATH:-/app/.kube/config}
      K8S_CONTEXT:          ${K8S_CONTEXT:-k3d-ccdt}
      DEMO_PROMETHEUS_URL:  http://host.docker.internal:19090
      PYTHONUNBUFFERED:     "1"
    volumes:
      - model-checkpoints:/app/checkpoints
      # Hot-reload source in dev
      - ./services/layer2-cognitive:/app:cached
      - ./shared:/app/shared:ro
      - ./.kube/k3d-ccdt.yaml:/app/.kube/config:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8001/health"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Layer-3: Guardian Executor
  # ────────────────────────────────────────────────────────────────────────────
  layer3-guardian:
    build:
      context: services/layer3-guardian
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "dev"
        GIT_SHA:    "dev"
    image: ccdt/layer3-guardian:dev
    user: root          # needed to access /var/run/docker.sock on macOS
    <<: *restart-policy
    hostname: layer3-guardian
    networks: [ccdt-net]
    ports:
      - "8002:8002"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      opa:
        condition: service_healthy
      layer2-gnn:
        condition: service_healthy
    environment:
      <<: *kafka-env
      LOG_LEVEL:            INFO
      AUTONOMY_MODE:        "full-auto"
      GNN_SERVICE_URL:      http://layer2-cognitive:8001
      OPA_URL:              http://opa:8181
      GHOST_RISK_THRESHOLD: "0.60"
      GHOST_CONFIDENCE_MIN: "0.20"
      OPA_FALLBACK_LOCAL:   "true"
      AGENT_MODEL_PATH:     /app/checkpoints/guardian_ppo_final
      K8S_NAMESPACE:        ${K8S_DEMO_NAMESPACE:-demo-app}
      K8S_DEMO_NAMESPACE:   ${K8S_DEMO_NAMESPACE:-demo-app}
      KUBECONFIG_PATH:      ${KUBECONFIG_PATH:-/app/.kube/config}
      K8S_CONTEXT:          ${K8S_CONTEXT:-k3d-ccdt}
      INFER_POLL_S:         "5"
      PYTHONUNBUFFERED:     "1"
      EXECUTOR_MODE:        "docker"   # Option D — DockerActionExecutor on macOS
    volumes:
      - rl-checkpoints:/app/checkpoints
      - ./services/layer3-guardian:/app:cached
      - ./shared:/app/shared:ro
      # Docker socket — enables real container restart/scale/isolate actions
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8002/health"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Layer-4: Co-Pilot (Claude API)
  # ────────────────────────────────────────────────────────────────────────────
  layer4-copilot:
    build:
      context: services/layer4-copilot
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "dev"
        GIT_SHA:    "dev"
    image: ccdt/layer4-copilot:dev
    <<: *restart-policy
    hostname: layer4-copilot
    networks: [ccdt-net]
    ports:
      - "8003:8003"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      layer2-gnn:
        condition: service_healthy
      layer3-guardian:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      <<: *kafka-env
      GROQ_API_KEY:            ${GROQ_API_KEY}
      GROQ_MODEL:              llama-3.3-70b-versatile
      GEMINI_API_KEY:          ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL:            gemini-2.5-flash
      MAX_TOKENS:              "2048"
      MAX_HISTORY_TURNS:       "20"
      GNN_SERVICE_URL:         http://layer2-cognitive:8001
      GUARDIAN_SERVICE_URL:    http://layer3-guardian:8002
      EBPF_SERVICE_URL:        http://layer1-nervous:9100
      AUTO_REPORT_CONFIDENCE:  "0.85"
      CONTEXT_FETCH_TIMEOUT_S: "3.0"
      LOG_LEVEL:               info
      PYTHONUNBUFFERED:        "1"
      OLLAMA_BASE_URL:         ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL:            ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ./services/layer4-copilot:/app:cached
      - ./shared:/app/shared:ro
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8003/health"]
    logging: *default-logging
  ollama:
    image: ollama/ollama:latest
    container_name: ccdt-ollama-1
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ccdt-net
  # ────────────────────────────────────────────────────────────────────────────
  # API Gateway
  # ────────────────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: apps/api-gateway
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "dev"
        GIT_SHA:    "dev"
    image: ccdt/api-gateway:dev
    <<: *restart-policy
    hostname: api-gateway
    networks: [ccdt-net]
    ports:
      - "8000:8000"
    depends_on:
      layer2-gnn:
        condition: service_healthy
      layer3-guardian:
        condition: service_healthy
      layer4-copilot:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *kafka-env
      JWT_SECRET:           ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      AUTH_DISABLED:        "true"     # disable JWT in local dev
      RATE_LIMIT:           "10000"    # relaxed for dev
      CORS_ORIGINS:         "*"
      GNN_SERVICE_URL:      http://layer2-cognitive:8001
      GUARDIAN_SERVICE_URL: http://layer3-guardian:8002
      COPILOT_SERVICE_URL:  http://layer4-copilot:8003
      REDIS_URL:            redis://redis:6379/0
      LOG_LEVEL:            INFO
      PYTHONUNBUFFERED:     "1"
    volumes:
      - ./apps/api-gateway:/app:cached
      - ./shared:/app/shared:ro
      - ccdt-data:/data   # SQLite database persistence
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8000/health"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Dashboard (React + Vite, dev server with HMR)
  # ────────────────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
      target: development    # uses the dev stage with Vite HMR
      args:
        BUILD_DATE: "dev"
    image: ccdt/dashboard:dev
    <<: *restart-policy
    hostname: dashboard
    networks: [ccdt-net]
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL:       http://localhost:8000
      VITE_WS_URL:             ws://localhost:8000
      VITE_MOCK_BACKEND:       "false"
      NODE_ENV:                development
    volumes:
      - ./apps/dashboard:/app:cached
      - /app/node_modules         # anonymous volume — don't overwrite container node_modules
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # macOS Cluster Simulator — replaces Layer-1 eBPF on macOS
  # Generates live rotating incidents and publishes to Kafka
  # ────────────────────────────────────────────────────────────────────────────
  simulator:
    build:
      context: ./services/layer2-cognitive
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "dev"
        GIT_SHA:    "dev"
    image: ccdt/layer2-cognitive:dev
    <<: *restart-policy
    hostname: simulator
    networks: [ccdt-net]
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      PYTHONUNBUFFERED:   "1"
      LOG_LEVEL:          INFO
      KUBECONFIG_PATH:    ${KUBECONFIG_PATH:-/app/.kube/config}
      K8S_CONTEXT:        ${K8S_CONTEXT:-k3d-ccdt}
      K8S_DEMO_NAMESPACE: ${K8S_DEMO_NAMESPACE:-demo-app}
    volumes:
      - ./services/layer2-cognitive:/app:cached
      - ./shared:/app/shared:ro
    command: ["python", "simulator.py", "--interval", "5"]
    logging: *default-logging

  # ════════════════════════════════════════════════════════════════════════════
  # Option D — Real Docker Services
  # Real PostgreSQL, Redis, Nginx, pgbouncer + traffic generator.
  # These produce genuine cgroup CPU/memory metrics that Prometheus scrapes
  # and the GNN reasons about. Guardian executes real Docker API actions on them.
  # ════════════════════════════════════════════════════════════════════════════

  demo-postgres:
    image: postgres:15-alpine
    <<: *restart-policy
    hostname: demo-postgres
    networks: [ccdt-net]
    ports:
      - "5433:5432"   # 5433 to avoid conflicts with any local postgres
    environment:
      POSTGRES_DB:       ccdt
      POSTGRES_USER:     ccdt
      POSTGRES_PASSWORD: ccdt
      POSTGRES_SHARED_BUFFERS: 128MB
    # Memory limit so OOM kills can actually happen under stress-ng
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U ccdt -d ccdt"]
    logging: *default-logging

  demo-redis:
    image: redis:7.2-alpine
    <<: *restart-policy
    hostname: demo-redis
    networks: [ccdt-net]
    ports:
      - "6380:6379"   # 6380 to avoid conflict with main CCDT redis
    # Hard 64MB limit so eviction storms occur naturally under load
    command: >
      redis-server
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --loglevel notice
    mem_limit: 128m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]
    logging: *default-logging

  demo-nginx:
    image: nginx:1.27-alpine
    <<: *restart-policy
    hostname: demo-nginx
    networks: [ccdt-net]
    ports:
      - "8088:80"
    volumes:
      - ./infra/demo/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
    logging: *default-logging

  demo-pgbouncer:
    image: edoburu/pgbouncer:latest
    <<: *restart-policy
    hostname: demo-pgbouncer
    networks: [ccdt-net]
    ports:
      - "5435:5432"
    environment:
      DB_USER:     ccdt
      DB_PASSWORD: ccdt
      DB_HOST:     demo-postgres
      DB_NAME:     ccdt
      POOL_MODE:   transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "10"
    depends_on:
      demo-postgres:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ccdt || exit 0"]
      start_period: 30s
    logging: *default-logging

  demo-traffic-gen:
    build:
      context: ./infra/demo
      dockerfile: Dockerfile.traffic
    image: ccdt/traffic-gen:dev
    pull_policy: never
    <<: *restart-policy
    hostname: demo-traffic-gen
    networks: [ccdt-net]
    depends_on:
      demo-postgres:
        condition: service_healthy
      demo-redis:
        condition: service_healthy
      demo-nginx:
        condition: service_healthy
    environment:
      NGINX_URL:              http://demo-nginx:80
      PG_DSN:                 postgresql://ccdt:ccdt@demo-postgres:5432/ccdt
      REDIS_URL_DEMO:         redis://demo-redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRAFFIC_INTERVAL:       "2.0"
      BURST_FACTOR:           "1.0"
      PYTHONUNBUFFERED:       "1"
    logging: *default-logging

  # cAdvisor — exports real cgroup CPU/memory/network stats for ALL containers
  # Prometheus scrapes this to get actual hardware metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    <<: *restart-policy
    hostname: cadvisor
    networks: [ccdt-net]
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    logging: *default-logging

  # ── Prometheus exporters for demo services ─────────────────────────────────
  demo-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    <<: *restart-policy
    hostname: demo-postgres-exporter
    networks: [ccdt-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://ccdt:ccdt@demo-postgres:5432/ccdt?sslmode=disable"
    depends_on:
      demo-postgres:
        condition: service_healthy
    logging: *default-logging

  demo-redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    <<: *restart-policy
    hostname: demo-redis-exporter
    networks: [ccdt-net]
    environment:
      REDIS_ADDR: redis://demo-redis:6379
    depends_on:
      demo-redis:
        condition: service_healthy
    logging: *default-logging

  demo-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    <<: *restart-policy
    hostname: demo-nginx-exporter
    networks: [ccdt-net]
    command: ["-nginx.scrape-uri", "http://demo-nginx/nginx_status"]
    depends_on:
      demo-nginx:
        condition: service_healthy
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Observability: Prometheus
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    <<: *restart-policy
    hostname: prometheus
    networks: [ccdt-net]
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - layer2-gnn
      - layer3-guardian
      - layer4-copilot
      - api-gateway
    profiles: [monitoring]
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
    logging: *default-logging

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    <<: *restart-policy
    hostname: grafana
    networks: [ccdt-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ccdt-dev}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_AUTH_ANONYMOUS_ENABLED:  "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ccdt-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles: [monitoring]
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
    logging: *default-logging

  # ────────────────────────────────────────────────────────────────────────────
  # Layer-1: eBPF Collector (Linux only — privileged, host PID namespace)
  # Start with: docker compose --profile ebpf up layer1-nervous
  # ────────────────────────────────────────────────────────────────────────────
  layer1-nervous:
    build:
      context: services/layer1-nervous
      dockerfile: Dockerfile
    image: ccdt/layer1-nervous:dev
    <<: *restart-policy
    hostname: layer1-nervous
    network_mode: host     # required for kernel-level visibility
    pid: host              # access host PID namespace for eBPF
    privileged: true       # required for BPF syscall
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *kafka-env
      ENABLED_PROBES:              capability,oom,tcp_retransmit,sched_latency,file_access,execve
      RING_BUFFER_SIZE_MB:         "64"
      PERF_BUFFER_PAGES:           "512"
      SCHED_LATENCY_THRESHOLD_US:  "5000"
      KAFKA_BATCH_SIZE:            "500"
      KAFKA_LINGER_MS:             "50"
      LOG_LEVEL:                   info
      K8S_NODE_NAME:               ${HOSTNAME:-localhost}
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/proc:ro
    profiles: [ebpf]
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/health"]
    logging: *default-logging