# ═══════════════════════════════════════════════════════════════════════════════
# CCDT Event Bus — Docker Compose: Kafka Cluster
# ═══════════════════════════════════════════════════════════════════════════════
#
# Services:
#   zookeeper          ZooKeeper 3.8 — broker coordination
#   kafka-1 … kafka-3  Kafka 3.7 cluster (3 brokers, RF-3)
#   kafka-init         One-shot container that creates all 4 topics
#   schema-registry    Confluent Schema Registry 7.6 (JSON schema validation)
#   kafka-ui           AKHQ UI — topic browser, consumer group monitor
#
# Ports (all on localhost):
#   9092               Kafka broker-1 external listener (PLAINTEXT)
#   9093               Kafka broker-2 external listener
#   9094               Kafka broker-3 external listener
#   8085               AKHQ UI  →  http://localhost:8085
#   8081               Schema Registry
#   2181               ZooKeeper
#
# Quick start:
#   cd ccdt/services/event-bus
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml ps
#
# Wait for brokers to be ready:
#   docker compose -f docker-compose.kafka.yml logs -f kafka-init
#
# Test producer:
#   docker exec -it kafka-1 kafka-console-producer.sh \
#     --broker-list localhost:9092 --topic ccdt.ebpf.events
#
# Test consumer:
#   docker exec -it kafka-1 kafka-console-consumer.sh \
#     --bootstrap-server localhost:9092 --topic ccdt.gnn.inference \
#     --from-beginning --max-messages 5
#
# Stop:
#   docker compose -f docker-compose.kafka.yml down -v

version: "3.9"

# ─── Shared networking ────────────────────────────────────────────────────────
networks:
  ccdt-bus:
    name: ccdt-bus
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

# ─── Volumes (persistent storage) ────────────────────────────────────────────
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  schema-registry-data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── ZooKeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.10
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
      ZOOKEEPER_SYNC_LIMIT:  5
      ZOOKEEPER_INIT_LIMIT:  10
      # Enable ZooKeeper 4LW commands for health checks
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Kafka Broker 1 ────────────────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.11
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners
      # PLAINTEXT_INTERNAL: broker-to-broker (Docker network)
      # PLAINTEXT_EXTERNAL: host access (localhost:9092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS:           "PLAINTEXT_INTERNAL://kafka-1:29092,PLAINTEXT_EXTERNAL://localhost:9092"
      KAFKA_LISTENERS:                      "PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME:     "PLAINTEXT_INTERNAL"

      # Replication
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS:         2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Performance
      KAFKA_NUM_PARTITIONS:              6
      KAFKA_NUM_NETWORK_THREADS:         4
      KAFKA_NUM_IO_THREADS:              8
      KAFKA_SOCKET_SEND_BUFFER_BYTES:    102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES:    104857600

      # Log settings
      KAFKA_LOG_RETENTION_HOURS:         168       # 7 days default
      KAFKA_LOG_RETENTION_BYTES:         -1
      KAFKA_LOG_SEGMENT_BYTES:           536870912  # 512 MB
      KAFKA_LOG_CLEANUP_POLICY:          delete
      KAFKA_COMPRESSION_TYPE:            lz4

      # JVM heap (suitable for 8 GB container)
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"

      # JMX for monitoring
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1

    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Kafka Broker 2 ────────────────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.12
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS:           "PLAINTEXT_INTERNAL://kafka-2:29092,PLAINTEXT_EXTERNAL://localhost:9093"
      KAFKA_LISTENERS:                      "PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME:     "PLAINTEXT_INTERNAL"
      KAFKA_DEFAULT_REPLICATION_FACTOR:     3
      KAFKA_MIN_INSYNC_REPLICAS:             2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:  2
      KAFKA_NUM_PARTITIONS:                 6
      KAFKA_NUM_NETWORK_THREADS:            4
      KAFKA_NUM_IO_THREADS:                 8
      KAFKA_LOG_RETENTION_HOURS:            168
      KAFKA_COMPRESSION_TYPE:               lz4
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Kafka Broker 3 ────────────────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.13
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS:           "PLAINTEXT_INTERNAL://kafka-3:29092,PLAINTEXT_EXTERNAL://localhost:9094"
      KAFKA_LISTENERS:                      "PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME:     "PLAINTEXT_INTERNAL"
      KAFKA_DEFAULT_REPLICATION_FACTOR:     3
      KAFKA_MIN_INSYNC_REPLICAS:             2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:  2
      KAFKA_NUM_PARTITIONS:                 6
      KAFKA_NUM_NETWORK_THREADS:            4
      KAFKA_NUM_IO_THREADS:                 8
      KAFKA_LOG_RETENTION_HOURS:            168
      KAFKA_COMPRESSION_TYPE:               lz4
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ── Topic initialiser (runs once then exits) ───────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - ccdt-bus
    # Create all 4 CCDT topics with their production configurations.
    # Each kafka-topics.sh call is idempotent (--if-not-exists).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS="kafka-1:29092,kafka-2:29092,kafka-3:29092"

        echo "=== Creating CCDT Kafka topics ==="

        # ── ccdt.ebpf.events ─────────────────────────────────────────────────
        echo "[1/4] Creating ccdt.ebpf.events..."
        kafka-topics.sh --create --if-not-exists \
          --bootstrap-server "$$BS" \
          --topic ccdt.ebpf.events \
          --partitions 12 \
          --replication-factor 3 \
          --config retention.ms=86400000 \
          --config retention.bytes=10737418240 \
          --config segment.ms=3600000 \
          --config segment.bytes=1073741824 \
          --config compression.type=lz4 \
          --config min.insync.replicas=2 \
          --config cleanup.policy=delete \
          --config max.message.bytes=65536

        # ── ccdt.gnn.inference ────────────────────────────────────────────────
        echo "[2/4] Creating ccdt.gnn.inference..."
        kafka-topics.sh --create --if-not-exists \
          --bootstrap-server "$$BS" \
          --topic ccdt.gnn.inference \
          --partitions 3 \
          --replication-factor 3 \
          --config retention.ms=604800000 \
          --config retention.bytes=5368709120 \
          --config segment.ms=3600000 \
          --config segment.bytes=536870912 \
          --config compression.type=gzip \
          --config min.insync.replicas=2 \
          --config cleanup.policy=delete \
          --config max.message.bytes=131072

        # ── ccdt.guardian.actions ─────────────────────────────────────────────
        echo "[3/4] Creating ccdt.guardian.actions..."
        kafka-topics.sh --create --if-not-exists \
          --bootstrap-server "$$BS" \
          --topic ccdt.guardian.actions \
          --partitions 6 \
          --replication-factor 3 \
          --config retention.ms=2592000000 \
          --config retention.bytes=10737418240 \
          --config segment.ms=86400000 \
          --config segment.bytes=536870912 \
          --config compression.type=gzip \
          --config min.insync.replicas=2 \
          --config cleanup.policy=delete \
          --config max.message.bytes=524288

        # ── ccdt.incidents ────────────────────────────────────────────────────
        echo "[4/4] Creating ccdt.incidents..."
        kafka-topics.sh --create --if-not-exists \
          --bootstrap-server "$$BS" \
          --topic ccdt.incidents \
          --partitions 3 \
          --replication-factor 3 \
          --config retention.ms=7776000000 \
          --config retention.bytes=5368709120 \
          --config segment.ms=86400000 \
          --config segment.bytes=268435456 \
          --config compression.type=gzip \
          --config min.insync.replicas=2 \
          --config "cleanup.policy=compact,delete" \
          --config max.message.bytes=1048576

        echo ""
        echo "=== All topics created. Listing: ==="
        kafka-topics.sh --list --bootstrap-server "$$BS"

        echo ""
        echo "=== Topic details: ==="
        for topic in ccdt.ebpf.events ccdt.gnn.inference ccdt.guardian.actions ccdt.incidents; do
          echo "--- $$topic ---"
          kafka-topics.sh --describe --bootstrap-server "$$BS" --topic "$$topic"
        done

        echo "=== kafka-init complete ==="

  # ── Schema Registry ───────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.20
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME:                 schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      SCHEMA_REGISTRY_LISTENERS:                 "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC:          _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_DEBUG:                     "false"
    volumes:
      - schema-registry-data:/var/lib/schema-registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── AKHQ Kafka UI ─────────────────────────────────────────────────────────
  kafka-ui:
    image: tchiotludo/akhq:0.24.0
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      ccdt-bus:
        ipv4_address: 172.30.0.30
    ports:
      - "8085:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            ccdt-kafka:
              properties:
                bootstrap.servers: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
              schema-registry:
                url: "http://schema-registry:8081"
          ui-options:
            topic:
              default-view: ALL
              skip-consumer-groups: false
            topic-data:
              sort: NEWEST
          security:
            default-group: no-roles   # open access — add auth for production

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
