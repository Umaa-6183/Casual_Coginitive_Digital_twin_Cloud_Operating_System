{{- if .Values.layer4.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: layer4-copilot
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: layer4-copilot-reader
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, events]
    verbs:     [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs:     [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs:     [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: layer4-copilot-reader
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     Role
  name:     layer4-copilot-reader
subjects:
  - kind:      ServiceAccount
    name:      layer4-copilot
    namespace: {{ include "ccdt.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer4-copilot
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
spec:
  replicas: {{ .Values.layer4.replicas }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "layer4-copilot" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: layer4-copilot
      securityContext:
        {{- include "ccdt.podSecurityContext" . | nindent 8 }}
      {{- if .Values.layer4.affinity.podAntiAffinity }}
      {{- include "ccdt.podAntiAffinity" "layer4-copilot" | nindent 6 }}
      {{- end }}
      {{- include "ccdt.computeTolerations" . | nindent 6 }}
      initContainers:
        - name: wait-for-guardian
          image: busybox:1.36
          command: ["/bin/sh", "-c", "until wget -qO- http://layer3-guardian:8002/ready >/dev/null 2>&1; do echo 'Waiting for Guardian...'; sleep 5; done"]
      containers:
        - name: copilot
          image: {{ include "ccdt.image" (dict "ctx" . "repo" .Values.layer4.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - -m
            - uvicorn
            - copilot:app
            - --host=0.0.0.0
            - --port=8003
            - --workers=2
          env:
            {{- include "ccdt.commonEnv" . | nindent 12 }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.layer4.existingSecret.name }}
                  name: {{ .Values.layer4.existingSecret.name }}
                  key:  {{ .Values.layer4.existingSecret.key }}
                  {{- else }}
                  name: ccdt-anthropic-credentials
                  key:  api-key
                  {{- end }}
            - name:  CLAUDE_MODEL
              value: {{ .Values.layer4.env.claudeModel | quote }}
            - name:  MAX_TOKENS
              value: {{ .Values.layer4.env.maxTokens | quote }}
            - name:  MAX_HISTORY_TURNS
              value: {{ .Values.layer4.env.maxHistoryTurns | quote }}
            - name:  AUTO_REPORT_CONFIDENCE
              value: {{ .Values.layer4.env.autoReportConfidence | quote }}
            - name:  CONTEXT_FETCH_TIMEOUT_S
              value: {{ .Values.layer4.env.contextFetchTimeoutS | quote }}
            - name:  GNN_SERVICE_URL
              value: http://layer2-cognitive:8001
            - name:  GUARDIAN_SERVICE_URL
              value: http://layer3-guardian:8002
            - name:  EBPF_SERVICE_URL
              value: http://layer1-nervous:9100
            - name:  API_GATEWAY_URL
              value: http://api-gateway:8000
            - name:  KAFKA_TOPIC_INFER
              value: ccdt.gnn.inference
            - name:  PORT
              value: "8003"
          ports:
            - { name: http,    containerPort: 8003, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: 8003 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.layer4.resources | nindent 12 }}
          securityContext:
            {{- include "ccdt.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: layer4-copilot
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
spec:
  selector:
    {{- include "ccdt.componentSelectorLabels" (list "layer4-copilot" .) | nindent 4 }}
  ports:
    - { name: http,    port: 8003, targetPort: http,    protocol: TCP }
    - { name: metrics, port: 9090, targetPort: metrics, protocol: TCP }
  type: ClusterIP
{{- if .Values.layer4.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: layer4-copilot
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       layer4-copilot
  minReplicas: {{ .Values.layer4.hpa.minReplicas }}
  maxReplicas: {{ .Values.layer4.hpa.maxReplicas }}
  {{- include "ccdt.hpaMetrics" .Values.layer4.hpa | nindent 2 }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 180 }
{{- end }}
{{- if .Values.layer4.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: layer4-copilot
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer4-copilot" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.layer4.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "layer4-copilot" .) | nindent 6 }}
{{- end }}
{{- end }}
