{{/*
CCDT — Namespace + ResourceQuota + LimitRange + NetworkPolicy
Only rendered when Release.Namespace == global.namespace (i.e., chart owns the namespace).
*/}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
    pod-security.kubernetes.io/warn:    restricted
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ccdt-quota
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu:    "32"
    requests.memory: "64Gi"
    limits.cpu:      "64"
    limits.memory:   "128Gi"
    pods:            "100"
    services:        "30"
    secrets:         "60"
    configmaps:      "40"
    count/deployments.apps: "20"
    count/daemonsets.apps:  "5"
    count/horizontalpodautoscalers.autoscaling: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ccdt-limitrange
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu:    "500m"
        memory: "512Mi"
      defaultRequest:
        cpu:    "100m"
        memory: "128Mi"
      max:
        cpu:    "8"
        memory: "16Gi"
      min:
        cpu:    "10m"
        memory: "32Mi"
