{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "dashboard" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 8 }}
    spec:
      serviceAccountName: dashboard
      securityContext:
        {{- include "ccdt.podSecurityContext" . | nindent 8 }}
      {{- include "ccdt.podAntiAffinity" "dashboard" | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "ccdt.image" (dict "ctx" . "repo" .Values.dashboard.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name:  VITE_API_BASE_URL
              value: {{ printf "https://api.%s" .Values.global.domain | quote }}
            - name:  VITE_WS_URL
              value: {{ printf "wss://api.%s" .Values.global.domain | quote }}
            - name:  LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false    # Vite/Node writes to disk
            runAsNonRoot:             true
            runAsUser:                1000
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
spec:
  selector:
    {{- include "ccdt.componentSelectorLabels" (list "dashboard" .) | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.dashboard.service.port }}, targetPort: http, protocol: TCP }
  type: {{ .Values.dashboard.service.type }}
{{- if .Values.dashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class:    {{ .Values.dashboard.ingress.className | quote }}
    {{- if .Values.dashboard.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ .Values.dashboard.ingress.certIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- with .Values.dashboard.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.dashboard.ingress.className | quote }}
  {{- $host := .Values.dashboard.ingress.host | default .Values.global.domain }}
  {{- if .Values.dashboard.ingress.tls }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: dashboard-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
{{- end }}
{{- if .Values.dashboard.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       dashboard
  minReplicas: {{ .Values.dashboard.hpa.minReplicas }}
  maxReplicas: {{ .Values.dashboard.hpa.maxReplicas }}
  {{- include "ccdt.hpaMetrics" .Values.dashboard.hpa | nindent 2 }}
{{- end }}
{{- if .Values.dashboard.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "dashboard" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.dashboard.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "dashboard" .) | nindent 6 }}
{{- end }}
{{- end }}
