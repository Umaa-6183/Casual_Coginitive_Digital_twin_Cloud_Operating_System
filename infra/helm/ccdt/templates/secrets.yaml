{{/*
CCDT — Secrets
Manages all platform secrets. In production, replace with External Secrets Operator
or Vault Agent Injector — never store real values in values.yaml.
*/}}
---
# ── Kafka credentials ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ccdt-kafka-credentials
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    description: "Kafka bootstrap server + optional SASL credentials"
type: Opaque
stringData:
  bootstrap-servers: {{ include "ccdt.kafkaBootstrap" . | quote }}
  {{- if .Values.secrets.kafkaUsername }}
  username: {{ .Values.secrets.kafkaUsername | quote }}
  password: {{ .Values.secrets.kafkaPassword | quote }}
  {{- end }}
---
# ── Anthropic API key (Layer 4 Co-Pilot) ──────────────────────────────────────
{{- if and .Values.layer4.enabled (not .Values.layer4.existingSecret.name) }}
{{- if .Values.layer4.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: ccdt-anthropic-credentials
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    description: "Anthropic Claude API key for Layer-4 Co-Pilot"
type: Opaque
stringData:
  api-key: {{ .Values.layer4.anthropicApiKey | quote }}
{{- end }}
{{- end }}
---
# ── API Gateway JWT secret ─────────────────────────────────────────────────────
{{- if .Values.secrets.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: ccdt-jwt-secret
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    description: "JWT signing secret for API Gateway"
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
