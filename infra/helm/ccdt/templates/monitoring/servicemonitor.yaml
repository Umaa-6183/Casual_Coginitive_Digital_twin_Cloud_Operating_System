{{/*
CCDT — ServiceMonitor CRDs for Prometheus Operator
Requires: prometheus-operator or kube-prometheus-stack installed in the cluster.
Set monitoring.serviceMonitor.enabled: true to deploy.
*/}}
{{- if .Values.monitoring.serviceMonitor.enabled }}

{{- if .Values.layer1.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: layer1-nervous
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    {{- include "ccdt.componentLabels" (list "layer1-nervous" .) | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ include "ccdt.namespace" . | quote }}]
  selector:
    matchLabels:
      app: layer1-nervous
  endpoints:
    - port:          metrics
      interval:      {{ .Values.layer1.serviceMonitor.interval }}
      path:          /metrics
      scheme:        http
      scrapeTimeout: 8s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}

