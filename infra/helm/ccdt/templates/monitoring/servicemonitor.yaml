---
# PrometheusRule: CCDT recording + alerting rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ccdt-rules
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    {{- include "ccdt.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ccdt.recording
      interval: 30s
      rules:
        - record: ccdt:gnn_inferences:rate1m
          expr:   rate(ccdt_gnn_inferences_total[1m]) * 60
        - record: ccdt:guardian_actions:rate5m
          expr:   rate(ccdt_guardian_actions_total[5m]) * 60
        - record: ccdt:opa_denial_rate:5m
          expr: |
            rate(ccdt_guardian_opa_denials_total[5m])
            / on() group_left()
            (rate(ccdt_guardian_actions_total[5m]) + 0.001)
        - record: ccdt:gnn_latency_p99:5m
          expr: |
            histogram_quantile(0.99,
              rate(ccdt_gnn_inference_duration_seconds_bucket[5m]))
        - record: ccdt:copilot_tokens_in:rate1m
          expr:   rate(ccdt_copilot_tokens_input_total[1m]) * 60
        - record: ccdt:copilot_tokens_out:rate1m
          expr:   rate(ccdt_copilot_tokens_output_total[1m]) * 60

    - name: ccdt.alerts
      rules:
        - alert: CCDTGNNInferenceSilent
          expr: |
            absent(rate(ccdt_gnn_inferences_total[2m]))
            or rate(ccdt_gnn_inferences_total[2m]) == 0
          for: 30s
          labels:
            severity: critical
            layer:    layer2
          annotations:
            summary:     "GNN inference silent > 30 s — Layer-2 may be down"
            description: "No GNN inferences detected. Check layer2-cognitive pods."

        - alert: CCDTGuardianDown
          expr: |
            kube_deployment_status_replicas_ready{deployment="layer3-guardian",
              namespace="{{ include "ccdt.namespace" . }}"} < 1
          for: 1m
          labels:
            severity: critical
            layer:    layer3
          annotations:
            summary: "Guardian is down — autonomous remediation DISABLED"

        - alert: CCDTOPADenialRateHigh
          expr:  ccdt:opa_denial_rate:5m > 0.30
          for:   2m
          labels:
            severity: warning
            layer:    layer3
          annotations:
            summary: "OPA denial rate {{ $value | humanizePercentage }} > 30%"

        - alert: CCDTCoPilotLatencyHigh
          expr: |
            histogram_quantile(0.95,
              rate(ccdt_copilot_latency_seconds_bucket[5m])) > 15
          for: 5m
          labels:
            severity: warning
            layer:    layer4
          annotations:
            summary: "Co-Pilot P95 latency {{ $value | humanizeDuration }} > 15 s"

        - alert: CCDTPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="{{ include "ccdt.namespace" . }}"}[15m]) * 900 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary:     "Pod {{ $labels.pod }} crash-looping"
            description: "Container {{ $labels.container }} restarting frequently."
{{- end }}
