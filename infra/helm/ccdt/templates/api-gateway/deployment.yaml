{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "api-gateway" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: api-gateway
      securityContext:
        {{- include "ccdt.podSecurityContext" . | nindent 8 }}
      {{- include "ccdt.podAntiAffinity" "api-gateway" | nindent 6 }}
      {{- include "ccdt.computeTolerations" . | nindent 6 }}
      containers:
        - name: api-gateway
          image: {{ include "ccdt.image" (dict "ctx" . "repo" .Values.apiGateway.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - -m
            - uvicorn
            - main:app
            - --host=0.0.0.0
            - --port=8000
            - --workers=2
          env:
            {{- include "ccdt.commonEnv" . | nindent 12 }}
            - name:  AUTH_DISABLED
              value: {{ .Values.apiGateway.env.authDisabled | quote }}
            - name:  RATE_LIMIT
              value: {{ .Values.apiGateway.env.rateLimit | quote }}
            - name:  CORS_ORIGINS
              value: {{ .Values.apiGateway.env.corsOrigins | quote }}
            - name:  GNN_SERVICE_URL
              value: http://layer2-cognitive:8001
            - name:  GUARDIAN_SERVICE_URL
              value: http://layer3-guardian:8002
            - name:  COPILOT_SERVICE_URL
              value: http://layer4-copilot:8003
            - name:  PORT
              value: "8000"
            {{- if .Values.secrets.jwtSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccdt-jwt-secret
                  key:  jwt-secret
            {{- end }}
          ports:
            - { name: http,    containerPort: 8000, protocol: TCP }
            - { name: metrics, containerPort: 9090, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            {{- include "ccdt.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
spec:
  selector:
    {{- include "ccdt.componentSelectorLabels" (list "api-gateway" .) | nindent 4 }}
  ports:
    - { name: http,    port: {{ .Values.apiGateway.service.port }}, targetPort: http, protocol: TCP }
    - { name: metrics, port: 9090, targetPort: metrics, protocol: TCP }
  type: {{ .Values.apiGateway.service.type }}
{{- if .Values.apiGateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class:             {{ .Values.apiGateway.ingress.className | quote }}
    nginx.ingress.kubernetes.io/use-regex:   "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    {{- if .Values.apiGateway.ingress.tls }}
    cert-manager.io/cluster-issuer:         {{ .Values.apiGateway.ingress.certIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- with .Values.apiGateway.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.apiGateway.ingress.className | quote }}
  {{- $host := .Values.apiGateway.ingress.host | default (printf "api.%s" .Values.global.domain) }}
  {{- if .Values.apiGateway.ingress.tls }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: api-gateway-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
{{- end }}
{{- if .Values.apiGateway.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       api-gateway
  minReplicas: {{ .Values.apiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.hpa.maxReplicas }}
  {{- include "ccdt.hpaMetrics" .Values.apiGateway.hpa | nindent 2 }}
{{- end }}
{{- if .Values.apiGateway.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: {{ include "ccdt.namespace" . }}
  labels:
    {{- include "ccdt.componentLabels" (list "api-gateway" .) | nindent 4 }}
spec:
  minAvailable: {{ .Values.apiGateway.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ccdt.componentSelectorLabels" (list "api-gateway" .) | nindent 6 }}
{{- end }}
{{- end }}
