server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the NexaOps mock business application
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health {
        return 200 '{"healthy":true,"service":"demo-nginx","time":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }
}
