server {
    listen 80;
    server_name _;

    location / {
        return 200 '{"status":"ok","service":"demo-nginx","time":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    location /health {
        return 200 '{"healthy":true}';
        add_header Content-Type application/json;
    }
    location /api/orders {
        return 200 '{"orders":[],"count":0}';
        add_header Content-Type application/json;
    }
    location /api/users {
        return 200 '{"users":[],"count":0}';
        add_header Content-Type application/json;
    }
    location /api/products {
        return 200 '{"products":[],"count":0}';
        add_header Content-Type application/json;
    }
    location /nginx_status {
        stub_status on;
        access_log off;
    }
}
