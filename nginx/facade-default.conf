# ─────────────────────────────────────────────────────────────────────────────
# CCDT Business Facade — nginx server block
# File: nginx/facade-default.conf
#
# HOW IT IS MOUNTED (in docker-compose.facade.yml):
#   - ./nginx/facade-default.conf:/etc/nginx/conf.d/default.conf:ro
#
# Mounting to the SAME target path (/etc/nginx/conf.d/default.conf) as the
# original config means Docker Compose override replaces the original mount.
# This is the correct approach — avoids having two server blocks both listening
# on port 80 with server_name _, which would silently serve the wrong one.
#
# PORT NOTE:
#   docker-compose.yml maps  host:8088 → container:80
#   This server block listens on port 80 (the CONTAINER-internal port).
#   Investors access the UI at http://localhost:8088 — that just works.
#   Do NOT use "listen 8088" here.
#
# ENDPOINTS PRESERVED from the original default.conf:
#   /health      — used by demo-nginx Docker healthcheck
#   /nginx_status — scraped by demo-nginx-exporter for Prometheus metrics
#
# NEW ENDPOINTS added for the Business Facade:
#   /          — serves NexaOps SaaS Portal (static HTML/JS)
#   /api/*     — reverse-proxied to mock-api:8089 (FastAPI backend)
#   /healthz   — liveness probe for mock-api
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80 default_server;
    server_name _;

    # ── Static SaaS UI ────────────────────────────────────────────────────────
    root  /usr/share/nginx/mock-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # No caching during demo — investors must always see the live state
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
    }

    # ── API Proxy → mock-api FastAPI (port 8089 inside Docker) ───────────────
    location /api/ {
        proxy_pass         http://mock-api:8089;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Short timeouts so the browser sees 502 quickly when the DB dies
        proxy_connect_timeout  3s;
        proxy_read_timeout     8s;
        proxy_send_timeout     5s;

        # Pass 502/504 through to the browser (don't replace with nginx error page)
        proxy_intercept_errors off;

        # CORS for browser fetch()
        add_header Access-Control-Allow-Origin  "*"                   always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Content-Type"        always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── mock-api readiness probe ──────────────────────────────────────────────
    location /healthz {
        proxy_pass  http://mock-api:8089/ready;
        access_log  off;
    }

    # ── PRESERVED: nginx healthcheck endpoint (used by Docker healthcheck) ────
    # Original default.conf had: curl -fsS http://localhost/health
    location /health {
        access_log  off;
        return 200  "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── PRESERVED: nginx stub_status (scraped by demo-nginx-exporter) ─────────
    location /nginx_status {
        stub_status on;
        access_log  off;
        allow       all;   # restrict to 172.28.0.0/16 in production
    }

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Error pages (investors will see these during attack scenarios) ─────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root        /usr/share/nginx/html;
        internal;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/mock-ui-access.log  combined;
    error_log   /var/log/nginx/mock-ui-error.log   warn;
}