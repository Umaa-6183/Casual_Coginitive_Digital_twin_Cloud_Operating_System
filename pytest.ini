[pytest]
# ═══════════════════════════════════════════════════════════════════════════════
# CCDT — pytest configuration
# ═══════════════════════════════════════════════════════════════════════════════
asyncio_mode = auto
testpaths   = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Default options ────────────────────────────────────────────────────────────
addopts =
    --strict-markers
    --tb=short
    -q
    --color=yes
    --durations=10
    --no-header

# ── Test markers ───────────────────────────────────────────────────────────────
markers =
    # Tier markers (run subsets with -m unit, -m integration, etc.)
    unit:        Pure unit tests — no network, no I/O (sub-50ms each)
    integration: Cross-component tests — mocked external services
    e2e:         End-to-end pipeline tests — full mock stack
    chaos:       Chaos / resilience tests — fault injection

    # Layer markers
    layer1: Tests touching Layer-1 Nervous System (eBPF / Go collector)
    layer2: Tests touching Layer-2 Cognitive Core (GNN inference)
    layer3: Tests touching Layer-3 Guardian (RL agent + OPA + executor)
    layer4: Tests touching Layer-4 Co-Pilot (Claude LLM interface)
    shared: Tests touching shared library (protos / schemas / utils)
    gateway: Tests touching API Gateway

    # Technology markers
    kafka:      Tests exercising Kafka producer / consumer paths
    grpc:       Tests exercising gRPC service calls
    kubernetes: Tests exercising Kubernetes API calls (always mocked)
    opa:        Tests exercising OPA policy evaluation
    llm:        Tests exercising Anthropic API calls (always mocked)

    # Special markers
    slow:     Tests expected to take > 500ms (not run in watch mode)
    smoke:    Quick sanity checks — run first in CI
    flaky:    Known-flaky tests that need fixing (never run in CI)
    property: Hypothesis property-based tests

# ── Coverage ───────────────────────────────────────────────────────────────────
# Run with: pytest --cov=services --cov=shared --cov-report=html
# (coverage options intentionally NOT in addopts — use Makefile targets instead)

# ── Timeouts ───────────────────────────────────────────────────────────────────
# Requires: pip install pytest-timeout
# timeout = 30        # default 30-second per-test timeout
# Chaos tests override this with @pytest.mark.timeout(120)

# ── Async ──────────────────────────────────────────────────────────────────────
# asyncio_mode = auto  means all async test functions run without @pytest.mark.asyncio
# Requires: pip install pytest-asyncio>=0.23

# ── Filtering examples ─────────────────────────────────────────────────────────
# pytest -m unit                    Only unit tests
# pytest -m "not slow"              Skip slow tests
# pytest -m "layer2 and unit"       Layer-2 unit tests only
# pytest -m "not (chaos or e2e)"    Skip chaos + e2e
# pytest -m smoke                   Smoke tests only (CI fast gate)
# pytest tests/unit/                Specific directory
# pytest -k "TestGnn"               Specific class
# pytest --lf                       Re-run only last-failed
# pytest -x                         Stop on first failure
# pytest -n auto                    Parallel (requires: pytest-xdist)
